<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980" role="img" aria-labelledby="title description">
  <title id="title">Ami: private wearable context and voice on an Android phone</title>
  <desc id="description">Reference data path: a Galaxy Watch sends records to Samsung Health. Health Connect permits read-only access to Ami's statistics and evidence. Foundry Local transcribes deliberate voice input; code routes questions and supplies answers. A separately confirmed experimental Qwen recap receives calculated weekly aggregates and selects two available fact IDs through a validated JSON contract, never free-form health advice. People confirm actions. Android TTS is separate. Model acquisition needs connectivity; tracker cloud sync remains outside Ami's control. Synthetic phone tests do not establish real-watch integration or offline isolation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101223"/><stop offset="1" stop-color="#1d2440"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#b9afff"/><stop offset="1" stop-color="#79e2cd"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#a5b1d2" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1360" height="980" rx="28" fill="url(#background)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#f4f3ff">
    <circle cx="64" cy="66" r="21" fill="url(#accent)"/>
    <text x="104" y="78" font-size="38" font-weight="700">Ami</text>
    <text x="48" y="124" font-size="20" fill="#b9c2d9">Personal context. Local conversation. Deliberate actions.</text>
    <rect x="48" y="176" width="194" height="182" rx="22" fill="#242b44" stroke="#414d70"/>
    <text x="71" y="215" font-size="14" fill="#79e2cd" letter-spacing="2">EXISTING WEARABLE</text>
    <text x="71" y="254" font-size="25" font-weight="600">Galaxy Watch4</text>
    <text x="71" y="290" font-size="17" fill="#b9c2d9">Activity and sleep</text>
    <text x="71" y="317" font-size="17" fill="#b9c2d9">Heart-rate samples</text>
    <rect x="280" y="165" width="1032" height="722" rx="28" fill="#141b2e" stroke="#766faf" stroke-width="2"/>
    <text x="310" y="203" font-size="17" fill="#b9afff" letter-spacing="1.5">MOTOROLA / ANDROID PHONE</text>
    <rect x="316" y="237" width="262" height="142" rx="18" fill="#232b45"/>
    <text x="339" y="277" font-size="23" font-weight="600">Samsung Health</text>
    <text x="339" y="311" font-size="16" fill="#b9c2d9">Watch-to-phone synchronization</text>
    <text x="339" y="339" font-size="16" fill="#b9c2d9">Freshness is not guaranteed live</text>
    <rect x="626" y="237" width="294" height="142" rx="18" fill="#232b45"/>
    <text x="649" y="277" font-size="23" font-weight="600">Health Connect</text>
    <text x="649" y="311" font-size="16" fill="#b9c2d9">Explicit, read-only permission</text>
    <text x="649" y="339" font-size="16" fill="#b9c2d9">Samsung-origin records only</text>
    <rect x="968" y="237" width="308" height="142" rx="18" fill="#173c3c" stroke="#3b8f81"/>
    <text x="991" y="277" font-size="23" font-weight="600">Stats + evidence</text>
    <text x="991" y="311" font-size="16" fill="#c2e8e0">Code owns arithmetic and dates</text>
    <text x="991" y="339" font-size="16" fill="#c2e8e0">Missing records stay missing</text>
    <rect x="316" y="450" width="262" height="154" rx="18" fill="#232b45"/>
    <text x="339" y="491" font-size="23" font-weight="600">Deliberate voice input</text>
    <text x="339" y="525" font-size="16" fill="#b9c2d9">Push to talk · max 20 seconds</text>
    <text x="339" y="553" font-size="16" fill="#b9c2d9">Or a labelled synthetic WAV</text>
    <text x="339" y="580" font-size="16" fill="#b9c2d9">Temporary audio is deleted</text>
    <rect x="626" y="450" width="294" height="154" rx="18" fill="#302855" stroke="#7667b4"/>
    <text x="649" y="491" font-size="23" font-weight="600">Foundry Local · IPC</text>
    <text x="649" y="525" font-size="16" fill="#d6d0ee">Whisper: speech → text</text>
    <text x="649" y="553" font-size="16" fill="#d6d0ee">Optional Qwen: two fact IDs</text>
    <text x="649" y="580" font-size="16" fill="#d6d0ee">No autonomous action tools</text>
    <rect x="968" y="450" width="308" height="154" rx="18" fill="#173c3c" stroke="#3b8f81"/>
    <text x="991" y="491" font-size="23" font-weight="600">Bounded conversation</text>
    <text x="991" y="525" font-size="16" fill="#c2e8e0">Rules + code-calculated answers</text>
    <text x="991" y="553" font-size="16" fill="#c2e8e0">Source, coverage, fallback labels</text>
    <text x="991" y="580" font-size="16" fill="#c2e8e0">Not free-form medical advice</text>
    <rect x="316" y="693" width="292" height="151" rx="18" fill="#232b45"/>
    <text x="339" y="735" font-size="23" font-weight="600">Intentional memory</text>
    <text x="339" y="768" font-size="16" fill="#b9c2d9">Encrypted local check-ins only</text>
    <text x="339" y="796" font-size="16" fill="#b9c2d9">Demo and personal stores separate</text>
    <text x="339" y="823" font-size="16" fill="#b9c2d9">Delete app memory ≠ source records</text>
    <rect x="653" y="693" width="292" height="151" rx="18" fill="#232b45"/>
    <text x="676" y="735" font-size="23" font-weight="600">Offline Android voice</text>
    <text x="676" y="768" font-size="16" fill="#b9c2d9">Installed non-network TTS voice</text>
    <text x="676" y="796" font-size="16" fill="#b9c2d9">No available voice → typed reply</text>
    <text x="676" y="823" font-size="16" fill="#b9c2d9">User-controlled playback</text>
    <rect x="990" y="693" width="286" height="151" rx="18" fill="#232b45"/>
    <text x="1013" y="735" font-size="23" font-weight="600">Confirmed reminders</text>
    <text x="1013" y="768" font-size="16" fill="#b9c2d9">User reviews and approves</text>
    <text x="1013" y="796" font-size="16" fill="#b9c2d9">One-shot, inexact local alarm</text>
    <text x="1013" y="823" font-size="16" fill="#b9c2d9">No health values on notification</text>
    <g fill="none" stroke="#a5b1d2" stroke-width="2" marker-end="url(#arrow)">
      <path d="M242 281 H304"/><path d="M578 307 H614"/><path d="M920 307 H956"/>
      <path d="M578 528 H614"/><path d="M920 528 H956"/><path d="M1122 379 V438"/>
      <path d="M1122 604 V681"/><path d="M1060 604 V648 H799 V681"/>
      <path d="M462 693 V644 H1004 V616"/>
      <path d="M990 379 V408 H886 V438" stroke-dasharray="5 5"/>
    </g>
    <text x="635" y="427" font-size="14" fill="#b9afff">Optional, consented aggregates</text>
    <text x="48" y="923" font-size="17" fill="#b9c2d9">Setup needs connectivity for models. Tracker cloud sync remains independent. Offline cold-start behavior must be tested.</text>
    <text x="48" y="954" font-size="15" fill="#91a0c0">Reference architecture · synthetic phone tests recorded · real-watch data and offline isolation still unverified.</text>
  </g>
</svg>
