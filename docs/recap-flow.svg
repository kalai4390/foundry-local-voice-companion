<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title description">
  <title id="title">An optional recap with Foundry Local</title>
  <desc id="description">This is separate from the ordinary voice turn and runs on the Android phone. Ami calculates fact cards from the available records. After the user's confirmation, Foundry Local runs Qwen 2.5 0.5B through its chat API to select two existing card IDs. Ami validates the IDs and displays the original calculated text. If the selection is invalid, Ami shows a labelled computed recap instead. The demonstration uses fictional records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#625477"/>
    </marker>
  </defs>
  <rect width="1000" height="360" rx="24" fill="#f6f4fb"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#24213a">
    <text x="28" y="46" font-size="32" font-weight="700">An optional recap with Foundry Local</text>
    <text x="28" y="78" font-size="20" fill="#55516b">A separate chat call selects existing facts. It does not write new advice.</text>
    <rect x="20" y="108" width="960" height="202" rx="22" fill="#ffffff" stroke="#c7bedb" stroke-width="2"/>
    <rect x="40" y="122" width="13" height="21" rx="3" fill="none" stroke="#625477" stroke-width="1.8"/>
    <path d="M 44 139 H 49" stroke="#625477" stroke-width="1.8"/>
    <text x="64" y="139" font-size="16" font-weight="700" letter-spacing="0.7" fill="#55516b">ON YOUR ANDROID PHONE</text>
    <text x="958" y="139" text-anchor="end" font-size="17" fill="#24614d">Fictional demo records</text>
    <g id="prepare">
      <rect x="40" y="160" width="264" height="130" rx="16" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="58" y="185" font-size="16" font-weight="700" fill="#24614d">1 · PREPARE</text>
      <text x="58" y="219" font-size="24" font-weight="700" fill="#24614d">Calculated facts</text>
      <text x="58" y="248" font-size="20" fill="#345e4e">Ami builds fact cards</text>
      <text x="58" y="274" font-size="19" fill="#345e4e">You confirm before use</text>
    </g>
    <g id="select">
      <rect x="368" y="160" width="264" height="130" rx="16" fill="#56349b"/>
      <text x="386" y="185" font-size="16" font-weight="700" fill="#eee8fc">2 · SELECT</text>
      <text x="386" y="219" font-size="26" font-weight="700" fill="#ffffff">Foundry Local</text>
      <text x="386" y="248" font-size="20" fill="#ffffff">Qwen 2.5 · 0.5B</text>
      <text x="386" y="274" font-size="19" fill="#eee8fc">Select two card IDs</text>
    </g>
    <g id="validate">
      <rect x="696" y="160" width="264" height="130" rx="16" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="714" y="185" font-size="16" font-weight="700" fill="#24614d">3 · VALIDATE</text>
      <text x="714" y="219" font-size="24" font-weight="700" fill="#24614d">Ami checks the IDs</text>
      <text x="714" y="248" font-size="20" fill="#345e4e">Show calculated text</text>
      <text x="714" y="274" font-size="19" fill="#345e4e">No new model claims</text>
    </g>
    <g fill="none" stroke="#625477" stroke-width="2.5" marker-end="url(#arrow)">
      <path id="cards-to-qwen" d="M 314 225 H 358"/>
      <path id="ids-to-ami" d="M 642 225 H 686"/>
    </g>
    <text x="28" y="343" font-size="18" fill="#55516b">Invalid selection? Ami shows a labelled, computed recap instead.</text>
  </g>
</svg>
