<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">From a spoken question to a local answer</title>
  <desc id="description">A landscape, left-to-right voice flow on an Android phone. The microphone records a question. Foundry Local transcribes the audio with Whisper Tiny, called through the Kotlin SDK and its separate local IPC service. Ami resolves the time range and calculates the answer from local records, which are fictional in this demo. An installed offline Android text-to-speech voice speaks the answer. Model and voice downloads happen before the conversation; inference runs on the phone. The optional chat recap is a separate flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#52647a"/>
    </marker>
  </defs>
  <rect width="1440" height="560" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#172b43">
    <text x="36" y="32" font-size="17" font-weight="700" letter-spacing="1.8" fill="#175caa">VOICE PATH</text>
    <text x="1404" y="32" text-anchor="end" font-size="17" font-weight="600" letter-spacing="0.8" fill="#52647a">ANDROID · IPC MODE</text>
    <text x="36" y="78" font-size="36" font-weight="650">From a spoken question to a local answer</text>
    <path d="M 36 98 H 1404" stroke="#d6dee8" stroke-width="1.5"/>
    <rect x="24" y="128" width="1392" height="374" fill="none" stroke="#9cabbc" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="40" y="112" width="348" height="30" fill="#ffffff"/>
    <text x="48" y="135" font-size="21" font-weight="600">Processing on the Android phone</text>
    <rect x="1190" y="112" width="210" height="30" fill="#ffffff"/>
    <text x="1392" y="135" text-anchor="end" font-size="21" font-weight="600" fill="#237158">No cloud inference</text>
    <g font-size="17" font-weight="700" letter-spacing="1" fill="#52647a">
      <text x="48" y="176">01  RECORD</text>
      <text x="362" y="176" fill="#175caa">02  TRANSCRIBE</text>
      <text x="744" y="176">03  CALCULATE</text>
      <text x="1126" y="176">04  SPEAK</text>
    </g>
    <g id="record">
      <rect x="48" y="192" width="228" height="160" fill="#ffffff" stroke="#9cabbc" stroke-width="1.5"/>
      <text x="68" y="232" font-size="27" font-weight="650">Microphone</text>
      <text x="68" y="271" font-size="23">Tap to record</text>
      <text x="68" y="323" font-size="19" fill="#52647a">A spoken question</text>
    </g>
    <g id="transcribe">
      <rect x="362" y="192" width="294" height="160" fill="#edf4fe" stroke="#175caa" stroke-width="1.5"/>
      <path d="M 362 192 H 656" stroke="#175caa" stroke-width="5"/>
      <text x="382" y="232" font-size="29" font-weight="700" fill="#124f94">Foundry Local</text>
      <text x="382" y="271" font-size="25">Whisper Tiny</text>
      <text x="382" y="302" font-size="21" fill="#344e6d">Speech-to-text</text>
      <text x="382" y="331" font-size="19" fill="#344e6d">Kotlin SDK → IPC service</text>
    </g>
    <g id="calculate">
      <rect x="744" y="192" width="294" height="160" fill="#ffffff" stroke="#9cabbc" stroke-width="1.5"/>
      <text x="764" y="232" font-size="27" font-weight="650">Ami · Kotlin</text>
      <text x="764" y="271" font-size="22">Resolve the time range</text>
      <text x="764" y="302" font-size="22">Calculate from records</text>
      <text x="764" y="331" font-size="19" fill="#52647a">Build the answer text</text>
    </g>
    <g id="speak">
      <rect x="1126" y="192" width="266" height="160" fill="#ffffff" stroke="#9cabbc" stroke-width="1.5"/>
      <text x="1146" y="232" font-size="27" font-weight="650">Android TTS</text>
      <text x="1146" y="271" font-size="25">Offline voice</text>
      <text x="1146" y="302" font-size="22">Speak the answer</text>
      <text x="1146" y="331" font-size="19" fill="#52647a">Installed on the phone</text>
    </g>
    <g fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)">
      <path id="audio-to-whisper" d="M 277 277 H 354"/>
      <path id="transcript-to-ami" d="M 657 277 H 736"/>
      <path id="answer-to-tts" d="M 1039 277 H 1118"/>
      <path id="records-to-ami" d="M 891 412 V 360"/>
    </g>
    <g font-size="18" text-anchor="middle" fill="#52647a">
      <text x="315" y="264">Audio</text>
      <text x="697" y="264">Text</text>
      <text x="1079" y="264">Reply</text>
    </g>
    <g id="records">
      <g fill="none" stroke="#237158" stroke-width="1.8">
        <ellipse cx="766" cy="429" rx="18" ry="6"/>
        <path d="M 748 429 V 456 C 748 464 784 464 784 456 V 429 M 748 442 C 748 450 784 450 784 442"/>
      </g>
      <text x="804" y="440" font-size="24" font-weight="600" fill="#237158">Local records</text>
      <text x="804" y="471" font-size="21" fill="#52647a">Fictional in this demo</text>
    </g>
    <text x="48" y="432" font-size="17" font-weight="700" letter-spacing="1" fill="#52647a">TRY A QUESTION</text>
    <text x="48" y="466" font-size="23">“When was my heartbeat high this week?”</text>
    <text x="36" y="541" font-size="20" fill="#52647a">Download the model and offline voice before starting a conversation.</text>
  </g>
</svg>
