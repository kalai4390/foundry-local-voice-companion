<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title description">
  <title id="title">Ami's voice flow with Foundry Local for Android</title>
  <desc id="description">On the phone, Android records a question, Foundry Local Whisper transcribes it, Ami calculates an answer from local sample records, and offline Android text to speech reads it back. In a separate optional recap, Foundry Local Qwen selects calculated fact cards and Ami validates the selection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70678d"/>
    </marker>
  </defs>
  <rect width="1180" height="650" rx="24" fill="#f6f4fb"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#24213a">
    <text x="40" y="52" font-size="28" font-weight="700">Ami's voice flow</text>
    <text x="40" y="83" font-size="18" fill="#625b74">Foundry Local for Android · all processing shown runs on the phone</text>
    <rect x="25" y="108" width="1130" height="516" rx="22" fill="#ffffff" stroke="#dcd6ea" stroke-width="2"/>
    <text x="50" y="142" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6e627f">ASK A QUESTION</text>

    <rect x="50" y="168" width="204" height="116" rx="14" fill="#eff4fb" stroke="#d3dfef"/>
    <text x="70" y="204" font-size="19" font-weight="600">Speak your question</text>
    <text x="70" y="238" font-size="17" fill="#53677e">Android microphone</text>
    <text x="70" y="262" font-size="16" fill="#53677e">Tap to record</text>

    <rect x="303" y="168" width="250" height="116" rx="14" fill="#eee7fc" stroke="#b9a5e5" stroke-width="2"/>
    <text x="323" y="204" font-size="23" font-weight="700" fill="#56349b">Foundry Local</text>
    <text x="323" y="238" font-size="17" fill="#56349b">Whisper Tiny · speech to text</text>
    <text x="323" y="262" font-size="16" fill="#736089">Service app, via IPC</text>

    <rect x="603" y="168" width="255" height="116" rx="14" fill="#edf7f2" stroke="#bddccc"/>
    <text x="623" y="204" font-size="23" font-weight="700" fill="#24614d">Ami</text>
    <text x="623" y="238" font-size="18" fill="#386a56">Calculate an answer</text>
    <text x="623" y="262" font-size="16" fill="#536e62">Resolve dates and records</text>

    <rect x="907" y="168" width="222" height="116" rx="14" fill="#eff4fb" stroke="#d3dfef"/>
    <text x="927" y="204" font-size="22" font-weight="600">Hear the reply</text>
    <text x="927" y="238" font-size="18" fill="#53677e">Offline Android TTS</text>
    <text x="927" y="262" font-size="16" fill="#53677e">Stop, replay or interrupt</text>

    <path d="M 258 226 H 294 M 558 226 H 594 M 863 226 H 898" stroke="#70678d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="603" y="337" width="255" height="73" rx="12" fill="#edf7f2" stroke="#bddccc"/>
    <text x="623" y="366" font-size="19" font-weight="600" fill="#24614d">Local records</text>
    <text x="623" y="392" font-size="16" fill="#536e62">Fictional demo records</text>
    <path d="M 730 333 V 294" stroke="#70678d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <text x="50" y="360" font-size="18" fill="#625b74">The spoken answer uses calculated facts.</text>
    <text x="50" y="387" font-size="18" fill="#625b74">The chat model is a separate, optional step.</text>

    <path d="M 50 439 H 1130" stroke="#e8e3f0" stroke-width="1.5"/>
    <text x="50" y="472" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6e627f">OPTIONAL WEEKLY RECAP</text>
    <rect x="50" y="490" width="250" height="73" rx="12" fill="#edf7f2" stroke="#bddccc"/>
    <text x="70" y="520" font-size="19" font-weight="600" fill="#24614d">Calculated fact cards</text>
    <text x="70" y="546" font-size="16" fill="#536e62">Shared after confirmation</text>
    <rect x="392" y="490" width="356" height="73" rx="12" fill="#eee7fc" stroke="#b9a5e5" stroke-width="2"/>
    <text x="412" y="520" font-size="21" font-weight="700" fill="#56349b">Foundry Local · Qwen</text>
    <text x="412" y="546" font-size="17" fill="#736089">Chat completion returns selected card IDs</text>
    <rect x="841" y="490" width="288" height="73" rx="12" fill="#edf7f2" stroke="#bddccc"/>
    <text x="861" y="520" font-size="19" font-weight="600" fill="#24614d">Ami validates the selection</text>
    <text x="861" y="546" font-size="16" fill="#536e62">Render the original calculated text</text>
    <path d="M 307 527 H 383 M 755 527 H 832" stroke="#70678d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="50" y="599" font-size="16" fill="#625b74">Model setup and downloads happen separately, before the conversation.</text>
  </g>
</svg>
