<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">On-device voice with Foundry Local</title>
  <desc id="description">All four steps run on the Android phone. First, tap to record a question. Second, Whisper Tiny transcribes it through the Foundry Local Kotlin SDK and local service using IPC. Third, Ami resolves dates and calculates the answer from local records; this demo uses fictional records. Fourth, an installed offline Android text-to-speech voice reads the answer. Model downloads and voice installation happen before the conversation. The optional chat recap is a separate flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#625477"/>
    </marker>
  </defs>
  <rect width="1000" height="500" rx="24" fill="#f6f4fb"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#24213a">
    <text x="28" y="46" font-size="34" font-weight="700">On-device voice with Foundry Local</text>
    <text x="28" y="78" font-size="20" fill="#55516b">Ami turns a spoken question into a reply using local context.</text>
    <rect x="20" y="108" width="960" height="346" rx="22" fill="#ffffff" stroke="#c7bedb" stroke-width="2"/>
    <rect x="40" y="122" width="13" height="21" rx="3" fill="none" stroke="#625477" stroke-width="1.8"/>
    <path d="M 44 139 H 49" stroke="#625477" stroke-width="1.8"/>
    <text x="64" y="139" font-size="16" font-weight="700" letter-spacing="0.7" fill="#55516b">ON YOUR ANDROID PHONE</text>
    <text x="958" y="139" text-anchor="end" font-size="17" font-weight="600" fill="#24614d">No cloud inference</text>
    <g id="record">
      <rect x="36" y="162" width="208" height="160" rx="16" fill="#eff4fb" stroke="#c7d7ec"/>
      <text x="54" y="190" font-size="16" font-weight="700" fill="#445d79">1 · RECORD</text>
      <text x="54" y="228" font-size="28" font-weight="700">Speak</text>
      <text x="54" y="261" font-size="20" fill="#445d79">Tap to record</text>
      <text x="54" y="291" font-size="18" fill="#445d79">Android microphone</text>
    </g>
    <g id="transcribe">
      <rect x="276" y="162" width="208" height="160" rx="16" fill="#56349b"/>
      <text x="294" y="190" font-size="16" font-weight="700" fill="#eee8fc">2 · TRANSCRIBE</text>
      <text x="294" y="228" font-size="24" font-weight="700" fill="#ffffff">Foundry Local</text>
      <text x="294" y="261" font-size="21" fill="#ffffff">Whisper Tiny</text>
      <text x="294" y="291" font-size="18" fill="#eee8fc">Kotlin SDK · IPC</text>
    </g>
    <g id="calculate">
      <rect x="516" y="162" width="208" height="160" rx="16" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="534" y="190" font-size="16" font-weight="700" fill="#24614d">3 · CALCULATE</text>
      <text x="534" y="228" font-size="28" font-weight="700" fill="#24614d">Ami</text>
      <text x="534" y="261" font-size="19" fill="#345e4e">Dates and numbers</text>
      <text x="534" y="291" font-size="19" fill="#345e4e">From local records</text>
    </g>
    <g id="speak">
      <rect x="756" y="162" width="208" height="160" rx="16" fill="#eff4fb" stroke="#c7d7ec"/>
      <text x="774" y="190" font-size="16" font-weight="700" fill="#445d79">4 · SPEAK BACK</text>
      <text x="774" y="228" font-size="24" font-weight="700">Hear the reply</text>
      <text x="774" y="261" font-size="21" fill="#445d79">Android TTS</text>
      <text x="774" y="291" font-size="19" fill="#445d79">Offline voice</text>
    </g>
    <g fill="none" stroke="#625477" stroke-width="2.5" marker-end="url(#arrow)">
      <path id="audio-to-whisper" d="M 250 242 H 270"/>
      <path id="transcript-to-ami" d="M 490 242 H 510"/>
      <path id="answer-to-tts" d="M 730 242 H 750"/>
      <path id="records-to-ami" d="M 620 348 V 332"/>
    </g>
    <g id="records">
      <rect x="516" y="356" width="208" height="84" rx="12" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="534" y="386" font-size="20" font-weight="600" fill="#24614d">Local records</text>
      <text x="534" y="414" font-size="18" fill="#345e4e">Fictional demo data</text>
    </g>
    <text x="54" y="365" font-size="16" font-weight="700" fill="#55516b">TRY ASKING</text>
    <text x="54" y="394" font-size="20" fill="#55516b">“When was my heartbeat high this week?”</text>
    <text x="28" y="484" font-size="18" fill="#55516b">Model downloads and voice setup happen before the conversation.</text>
  </g>
</svg>
