<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title description">
  <title id="title">On-device voice with Foundry Local</title>
  <desc id="description">The four steps are stacked for a narrow screen. All run on the Android phone. Tap to record a question; Whisper Tiny transcribes it through the Foundry Local Kotlin SDK and local service using IPC; Ami resolves dates and calculates an answer from local records; an installed offline Android text-to-speech voice reads the answer. The demonstration uses fictional records. Download the models and install the voice before the conversation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#625477"/>
    </marker>
  </defs>
  <rect width="360" height="1000" rx="24" fill="#f6f4fb"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#24213a">
    <text x="20" y="34" font-size="28" font-weight="700">On-device voice</text>
    <text x="20" y="72" font-size="28" font-weight="700">with Foundry Local</text>
    <text x="20" y="103" font-size="20" fill="#55516b">“When was my heartbeat</text>
    <text x="20" y="131" font-size="20" fill="#55516b">high this week?”</text>
    <rect x="12" y="151" width="336" height="772" rx="20" fill="#ffffff" stroke="#c7bedb" stroke-width="2"/>
    <rect x="32" y="169" width="13" height="21" rx="3" fill="none" stroke="#625477" stroke-width="1.8"/>
    <path d="M 36 186 H 41" stroke="#625477" stroke-width="1.8"/>
    <text x="56" y="185" font-size="18" font-weight="700" fill="#55516b">ON YOUR ANDROID PHONE</text>
    <text x="32" y="210" font-size="18" font-weight="600" fill="#24614d">No cloud inference</text>
    <g id="record">
      <rect x="28" y="228" width="304" height="132" rx="16" fill="#eff4fb" stroke="#c7d7ec"/>
      <text x="48" y="254" font-size="18" font-weight="700" fill="#445d79">1 · RECORD</text>
      <text x="48" y="288" font-size="27" font-weight="700">Speak</text>
      <text x="48" y="318" font-size="20" fill="#445d79">Tap to record</text>
      <text x="48" y="346" font-size="20" fill="#445d79">Android microphone</text>
    </g>
    <g id="transcribe">
      <rect x="28" y="396" width="304" height="140" rx="16" fill="#56349b"/>
      <text x="48" y="422" font-size="18" font-weight="700" fill="#eee8fc">2 · TRANSCRIBE</text>
      <text x="48" y="456" font-size="27" font-weight="700" fill="#ffffff">Foundry Local</text>
      <text x="48" y="487" font-size="22" fill="#ffffff">Whisper Tiny</text>
      <text x="48" y="517" font-size="20" fill="#eee8fc">Kotlin SDK · IPC</text>
    </g>
    <g id="calculate">
      <rect x="28" y="572" width="304" height="158" rx="16" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="48" y="598" font-size="18" font-weight="700" fill="#24614d">3 · CALCULATE</text>
      <text x="48" y="632" font-size="27" font-weight="700" fill="#24614d">Ami calculates</text>
      <text x="48" y="663" font-size="20" fill="#345e4e">Dates and numbers</text>
      <text x="48" y="690" font-size="20" fill="#345e4e">From local records</text>
      <text x="48" y="715" font-size="18" fill="#345e4e">Fictional demo data</text>
    </g>
    <g id="speak">
      <rect x="28" y="766" width="304" height="136" rx="16" fill="#eff4fb" stroke="#c7d7ec"/>
      <text x="48" y="792" font-size="18" font-weight="700" fill="#445d79">4 · SPEAK BACK</text>
      <text x="48" y="826" font-size="27" font-weight="700">Hear the reply</text>
      <text x="48" y="860" font-size="22" fill="#445d79">Android TTS</text>
      <text x="48" y="890" font-size="20" fill="#445d79">Installed offline voice</text>
    </g>
    <g fill="none" stroke="#625477" stroke-width="2.5" marker-end="url(#arrow)">
      <path id="audio-to-whisper" d="M 180 367 V 389"/>
      <path id="transcript-to-ami" d="M 180 543 V 565"/>
      <path id="answer-to-tts" d="M 180 737 V 759"/>
    </g>
    <text x="20" y="951" font-size="18" fill="#55516b">Download models and install</text>
    <text x="20" y="977" font-size="18" fill="#55516b">an offline voice before use.</text>
  </g>
</svg>
