<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-labelledby="title description">
  <title id="title">An optional recap with Foundry Local</title>
  <desc id="description">A separate chat call runs on the Android phone. Ami calculates fact cards from the available records. After the user's confirmation, Foundry Local runs Qwen 2.5 0.5B to select two existing card IDs. Ami validates the IDs and displays the original calculated text. Invalid selections use a labelled computed recap instead. These three steps are stacked for narrow screens. The demonstration uses fictional records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#625477"/>
    </marker>
  </defs>
  <rect width="360" height="790" rx="24" fill="#f6f4fb"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#24213a">
    <text x="20" y="34" font-size="28" font-weight="700">An optional recap</text>
    <text x="20" y="72" font-size="28" font-weight="700">with Foundry Local</text>
    <text x="20" y="101" font-size="18" fill="#55516b">A separate call to the chat API.</text>
    <rect x="12" y="122" width="336" height="588" rx="20" fill="#ffffff" stroke="#c7bedb" stroke-width="2"/>
    <rect x="32" y="141" width="13" height="21" rx="3" fill="none" stroke="#625477" stroke-width="1.8"/>
    <path d="M 36 158 H 41" stroke="#625477" stroke-width="1.8"/>
    <text x="56" y="157" font-size="18" font-weight="700" fill="#55516b">ON YOUR ANDROID PHONE</text>
    <text x="32" y="183" font-size="18" fill="#24614d">Fictional demo records</text>
    <g id="prepare">
      <rect x="28" y="200" width="304" height="140" rx="16" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="48" y="226" font-size="18" font-weight="700" fill="#24614d">1 · PREPARE</text>
      <text x="48" y="260" font-size="26" font-weight="700" fill="#24614d">Calculated facts</text>
      <text x="48" y="289" font-size="20" fill="#345e4e">Ami builds fact cards</text>
      <text x="48" y="318" font-size="20" fill="#345e4e">You confirm before use</text>
    </g>
    <g id="select">
      <rect x="28" y="376" width="304" height="140" rx="16" fill="#56349b"/>
      <text x="48" y="402" font-size="18" font-weight="700" fill="#eee8fc">2 · SELECT</text>
      <text x="48" y="436" font-size="27" font-weight="700" fill="#ffffff">Foundry Local</text>
      <text x="48" y="469" font-size="22" fill="#ffffff">Qwen 2.5 · 0.5B</text>
      <text x="48" y="499" font-size="20" fill="#eee8fc">Select two card IDs</text>
    </g>
    <g id="validate">
      <rect x="28" y="552" width="304" height="140" rx="16" fill="#edf7f2" stroke="#b7d7c8"/>
      <text x="48" y="578" font-size="18" font-weight="700" fill="#24614d">3 · VALIDATE</text>
      <text x="48" y="612" font-size="26" font-weight="700" fill="#24614d">Ami checks the IDs</text>
      <text x="48" y="640" font-size="20" fill="#345e4e">Show calculated text</text>
      <text x="48" y="670" font-size="20" fill="#345e4e">No new model claims</text>
    </g>
    <g fill="none" stroke="#625477" stroke-width="2.5" marker-end="url(#arrow)">
      <path id="cards-to-qwen" d="M 180 347 V 369"/>
      <path id="ids-to-ami" d="M 180 523 V 545"/>
    </g>
    <text x="20" y="741" font-size="18" fill="#55516b">Invalid selection? Ami shows a</text>
    <text x="20" y="767" font-size="18" fill="#55516b">labelled, computed recap instead.</text>
  </g>
</svg>
